[project]
name = "market-sentinel"
version = "0.3.0"
description = "Low-latency market monitoring core for developer hosts"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
live = [
    "httpx>=0.27",
    "longbridge>=4.0",
]

[project.scripts]
market-sentinel = "market_sentinel.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/market_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-m", "not live"]
markers = [
    "integration: end-to-end core tests that must stay offline by default",
    "live: optional network/vendor probes; excluded from default pytest",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "tools"]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["market_sentinel"]
branch = true

[tool.coverage.report]
fail_under = 85
